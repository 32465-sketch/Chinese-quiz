<!doctype html><html lang='th'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Chinese Quiz HSK 1–3</title><style>
:root{--red:#d93b36;--cream:#fff8ec;--ink:#2e2925;--green:#2e9d68;--muted:#766f69}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,'Noto Sans Thai',sans-serif;background:linear-gradient(#fff8ec,#fff);color:var(--ink)}.app{max-width:520px;margin:auto;min-height:100vh;padding:22px}.hero{text-align:center;padding:26px 8px}.logo{font-size:58px}.hero h1{margin:4px 0;color:var(--red);font-size:34px}.hero p{color:var(--muted)}.card{background:white;border:1px solid #f0dfcf;border-radius:22px;padding:18px;margin:12px 0;box-shadow:0 8px 25px #9f7d5d18}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btn{width:100%;border:0;border-radius:16px;padding:14px 16px;font-size:16px;font-weight:700;cursor:pointer;background:#f6e9da;color:var(--ink)}.btn.primary{background:var(--red);color:white}.btn.green{background:var(--green);color:white}.btn:active{transform:scale(.98)}.top{display:flex;justify-content:space-between;align-items:center}.score{font-weight:800;color:#9b6b00}.word{text-align:center;font-size:52px;font-weight:800;margin:20px 0 0}.pinyin{text-align:center;color:var(--muted);font-size:20px;margin-bottom:22px}.answers{display:grid;gap:10px}.answer{text-align:left}.answer.correct{background:#dff5e8}.answer.wrong{background:#ffe2df}.feedback{margin-top:14px;padding:14px;border-radius:14px;background:#fff2e9}.hidden{display:none}.pill{display:inline-block;padding:7px 11px;border-radius:999px;background:#f7e6d4;margin:4px}.center{text-align:center}.bigscore{font-size:46px;font-weight:900;color:var(--red);margin:10px}.sentence{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:58px;padding:10px;border:2px dashed #e9cbb3;border-radius:16px}.token{border:0;border-radius:12px;background:#f6e9da;padding:10px 14px;font-size:18px}.small{font-size:13px;color:var(--muted)}footer{text-align:center;color:#9a8f87;font-size:12px;padding:24px 0}
</style></head><body><main class='app'>
<section id='home'><div class='hero'><div class='logo'>🇨🇳</div><h1>Chinese Quiz</h1><p>เกมภาษาจีน HSK 1–3 • ระบบเก่า HSK 2.0</p></div><div class='card'><h3>เลือกระดับให้ชัดเจน</h3><p class='small'>แต่ละระดับเป็นชุดของตัวเอง ไม่รวมคำจากระดับก่อนหน้า</p><div class='grid'><button class='btn primary' onclick='levelMenu(1)'>HSK 1</button><button class='btn primary' onclick='levelMenu(2)'>HSK 2</button><button class='btn primary' onclick='levelMenu(3)'>HSK 3</button></div></div><div class='card'><h3>เรียนและเล่น</h3><div class='grid'><button class='btn' onclick='chooseVocabLevel()'>📚 คำศัพท์ HSK 1–3</button><button class='btn' onclick='chooseStrokeLevel()'>✍️ ลำดับขีด</button><button class='btn' onclick='chooseQuizLevel()'>🎮 Quiz 10 ข้อ</button><button class='btn' onclick='chooseSentenceLevel()'>🧩 เรียงประโยค</button></div></div></section>
<section id='categories' class='hidden'></section>
<section id='quiz' class='hidden'><div class='top'><button class='btn' style='width:auto' onclick='home()'>✕</button><span id='progress'>คำถาม 1/10</span><span class='score'>⭐ <span id='score'>0</span>/10</span></div><div class='card'><div id='qword' class='word'></div><div id='qpinyin' class='pinyin'></div><h3 class='center'>หมายถึงอะไร?</h3><div id='answers' class='answers'></div><div id='feedback' class='feedback hidden'></div><button id='next' class='btn primary hidden' style='margin-top:12px' onclick='nextQ()'>ข้อถัดไป →</button></div></section>
<section id='result' class='hidden center'><div class='card'><div style='font-size:58px'>🎉</div><h1>จบเกม!</h1><p>คะแนนของคุณ</p><div class='bigscore'><span id='finalScore'>0</span> / <span id='finalTotal'>10</span></div><p>✅ ตอบถูก <b id='correctN'></b> ข้อ</p><p>❌ ตอบผิด <b id='wrongN'></b> ข้อ</p><h3>⭐ ระดับ: <span id='level'></span></h3><button class='btn primary' onclick='start(currentLevel)'>🔄 เล่นอีกครั้ง</button><button class='btn' style='margin-top:10px' onclick='shareResult()'>🔗 แชร์ผลคะแนน</button><button class='btn' style='margin-top:10px' onclick='home()'>🏠 กลับหน้าหลัก</button></div></section>
<section id='simple' class='hidden'></section><footer>Chinese Quiz • HSK 1–3</footer></main>
<script>
const vocab=[
{c:'妈妈',p:'māma',t:'แม่',h:1,cat:'ครอบครัว'},{c:'爸爸',p:'bàba',t:'พ่อ',h:1,cat:'ครอบครัว'},{c:'儿子',p:'érzi',t:'ลูกชาย',h:1,cat:'ครอบครัว'},{c:'女儿',p:'nǚ’ér',t:'ลูกสาว',h:1,cat:'ครอบครัว'},{c:'哥哥',p:'gēge',t:'พี่ชาย',h:2,cat:'ครอบครัว'},{c:'姐姐',p:'jiějie',t:'พี่สาว',h:2,cat:'ครอบครัว'},{c:'弟弟',p:'dìdi',t:'น้องชาย',h:2,cat:'ครอบครัว'},{c:'妹妹',p:'mèimei',t:'น้องสาว',h:2,cat:'ครอบครัว'},{c:'爷爷',p:'yéye',t:'ปู่/ตา',h:3,cat:'ครอบครัว'},{c:'奶奶',p:'nǎinai',t:'ย่า/ยาย',h:3,cat:'ครอบครัว'},
{c:'苹果',p:'píngguǒ',t:'แอปเปิล',h:1,cat:'อาหาร'},{c:'水',p:'shuǐ',t:'น้ำ',h:1,cat:'อาหาร'},{c:'茶',p:'chá',t:'ชา',h:1,cat:'อาหาร'},{c:'米饭',p:'mǐfàn',t:'ข้าวสวย',h:1,cat:'อาหาร'},{c:'菜',p:'cài',t:'อาหาร/กับข้าว',h:1,cat:'อาหาร'},{c:'牛奶',p:'niúnǎi',t:'นม',h:2,cat:'อาหาร'},{c:'鸡蛋',p:'jīdàn',t:'ไข่ไก่',h:2,cat:'อาหาร'},{c:'西瓜',p:'xīguā',t:'แตงโม',h:2,cat:'อาหาร'},{c:'面条',p:'miàntiáo',t:'บะหมี่',h:3,cat:'อาหาร'},{c:'面包',p:'miànbāo',t:'ขนมปัง',h:3,cat:'อาหาร'},
{c:'吃',p:'chī',t:'กิน',h:1,cat:'คำกริยา'},{c:'喝',p:'hē',t:'ดื่ม',h:1,cat:'คำกริยา'},{c:'看',p:'kàn',t:'ดู/อ่าน',h:1,cat:'คำกริยา'},{c:'听',p:'tīng',t:'ฟัง',h:1,cat:'คำกริยา'},{c:'说',p:'shuō',t:'พูด',h:1,cat:'คำกริยา'},{c:'学习',p:'xuéxí',t:'เรียน',h:1,cat:'คำกริยา'},{c:'买',p:'mǎi',t:'ซื้อ',h:1,cat:'คำกริยา'},{c:'跑步',p:'pǎobù',t:'วิ่ง',h:2,cat:'คำกริยา'},{c:'游泳',p:'yóuyǒng',t:'ว่ายน้ำ',h:2,cat:'คำกริยา'},{c:'决定',p:'juédìng',t:'ตัดสินใจ',h:3,cat:'คำกริยา'},
{c:'红',p:'hóng',t:'สีแดง',h:2,cat:'สี'},{c:'白',p:'bái',t:'สีขาว',h:2,cat:'สี'},{c:'黑',p:'hēi',t:'สีดำ',h:2,cat:'สี'},{c:'蓝',p:'lán',t:'สีน้ำเงิน',h:2,cat:'สี'},{c:'绿',p:'lǜ',t:'สีเขียว',h:2,cat:'สี'},{c:'黄',p:'huáng',t:'สีเหลือง',h:2,cat:'สี'},
{c:'学校',p:'xuéxiào',t:'โรงเรียน',h:1,cat:'สถานที่'},{c:'老师',p:'lǎoshī',t:'ครู',h:1,cat:'สถานที่'},{c:'学生',p:'xuésheng',t:'นักเรียน',h:1,cat:'สถานที่'},{c:'书',p:'shū',t:'หนังสือ',h:1,cat:'สถานที่'},{c:'汉语',p:'Hànyǔ',t:'ภาษาจีน',h:1,cat:'สถานที่'},{c:'考试',p:'kǎoshì',t:'สอบ/การสอบ',h:2,cat:'สถานที่'},{c:'教室',p:'jiàoshì',t:'ห้องเรียน',h:2,cat:'สถานที่'},{c:'作业',p:'zuòyè',t:'การบ้าน',h:2,cat:'สถานที่'},{c:'成绩',p:'chéngjì',t:'ผลการเรียน/คะแนน',h:3,cat:'สถานที่'},
{c:'你好',p:'nǐ hǎo',t:'สวัสดี',h:1,cat:'ประโยคในชีวิตประจำวัน'},{c:'谢谢',p:'xièxie',t:'ขอบคุณ',h:1,cat:'ประโยคในชีวิตประจำวัน'},{c:'再见',p:'zàijiàn',t:'ลาก่อน',h:1,cat:'ประโยคในชีวิตประจำวัน'},{c:'对不起',p:'duìbuqǐ',t:'ขอโทษ',h:1,cat:'ประโยคในชีวิตประจำวัน'},{c:'没关系',p:'méi guānxi',t:'ไม่เป็นไร',h:1,cat:'ประโยคในชีวิตประจำวัน'},{c:'欢迎',p:'huānyíng',t:'ยินดีต้อนรับ',h:2,cat:'ประโยคในชีวิตประจำวัน'},
{c:'桌子',p:'zhuōzi',t:'โต๊ะ',h:1,cat:'ของใช้ประจำวัน'},{c:'椅子',p:'yǐzi',t:'เก้าอี้',h:1,cat:'ของใช้ประจำวัน'},{c:'杯子',p:'bēizi',t:'แก้ว',h:1,cat:'ของใช้ประจำวัน'},{c:'衣服',p:'yīfu',t:'เสื้อผ้า',h:1,cat:'ของใช้ประจำวัน'},{c:'电脑',p:'diànnǎo',t:'คอมพิวเตอร์',h:1,cat:'ของใช้ประจำวัน'},{c:'手机',p:'shǒujī',t:'โทรศัพท์มือถือ',h:2,cat:'ของใช้ประจำวัน'},{c:'手表',p:'shǒubiǎo',t:'นาฬิกาข้อมือ',h:2,cat:'ของใช้ประจำวัน'},{c:'帽子',p:'màozi',t:'หมวก',h:2,cat:'ของใช้ประจำวัน'},{c:'行李箱',p:'xínglixiāng',t:'กระเป๋าเดินทาง',h:3,cat:'ของใช้ประจำวัน'}
];
const cats={}; vocab.forEach(v=>(cats[v.cat]??=[]).push([v.c,v.p,v.t,v.h]));
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function makeQuestion(v,pool){let wrong=shuffle(pool.filter(x=>x.t!==v.t)).slice(0,3).map(x=>x.t);return {...v,o:shuffle([v.t,...wrong])}}
const sentences=[
{h:1,w:['苹果','我','喜欢'],a:'我喜欢苹果',p:'Wǒ xǐhuan píngguǒ.',t:'ฉันชอบแอปเปิล'},
{h:1,w:['学生','是','我'],a:'我是学生',p:'Wǒ shì xuésheng.',t:'ฉันเป็นนักเรียน'},
{h:1,w:['喝','我','水'],a:'我喝水',p:'Wǒ hē shuǐ.',t:'ฉันดื่มน้ำ'},
{h:1,w:['学校','去','我'],a:'我去学校',p:'Wǒ qù xuéxiào.',t:'ฉันไปโรงเรียน'},
{h:2,w:['很好','老师','我的'],a:'我的老师很好',p:'Wǒ de lǎoshī hěn hǎo.',t:'ครูของฉันดีมาก'},
{h:1,w:['汉语','学习','我'],a:'我学习汉语',p:'Wǒ xuéxí Hànyǔ.',t:'ฉันเรียนภาษาจีน'},
{h:1,w:['妈妈','爱','我'],a:'我爱妈妈',p:'Wǒ ài māma.',t:'ฉันรักแม่'},
{h:1,w:['书','看','他'],a:'他看书',p:'Tā kàn shū.',t:'เขาอ่านหนังสือ'},
{h:2,w:['漂亮','很','她'],a:'她很漂亮',p:'Tā hěn piàoliang.',t:'เธอสวยมาก'},
{h:2,w:['中国菜','喜欢','我们'],a:'我们喜欢中国菜',p:'Wǒmen xǐhuan Zhōngguó cài.',t:'พวกเราชอบอาหารจีน'}];
let game=[],idx=0,points=0,currentLevel=1,locked=false;
function hide(){['home','categories','quiz','result','simple'].forEach(x=>document.getElementById(x).classList.add('hidden'))}function home(){hide();document.getElementById('home').classList.remove('hidden')}
const catIcons={'ครอบครัว':'🧑‍👩‍👧‍👦','อาหาร':'🍎','คำกริยา':'🏃','สี':'🎨','สถานที่':'🏫','ประโยคในชีวิตประจำวัน':'👋','ของใช้ประจำวัน':'🏠'};
function levelMenu(l){currentLevel=l;hide();let s=document.getElementById('simple');s.classList.remove('hidden');s.innerHTML=`<div class='top'><button class='btn' style='width:auto' onclick='home()'>← กลับ</button><b>HSK ${l}</b></div><div class='card center'><h2>HSK ${l}</h2><p>เลือกรูปแบบเกม</p><button class='btn primary' onclick='start(${l})'>🎮 Quiz 10 ข้อ</button><button class='btn' style='margin-top:10px' onclick='sentenceGame(${l})'>🧩 เรียงประโยค</button><button class='btn' style='margin-top:10px' onclick='showVocab(${l})'>📚 คำศัพท์ HSK ${l}</button><button class='btn' style='margin-top:10px' onclick='showStroke(${l})'>✍️ ลำดับขีด HSK ${l}</button><button class='btn' style='margin-top:10px' onclick='showCategories(${l})'>🗂️ เลือกหมวดสำหรับ Quiz</button></div>`}

function chooseVocabLevel(){simplePage(`<div class='card center'><h2>📚 เลือกระดับคำศัพท์</h2><div class='grid'><button class='btn primary' onclick='showVocab(1)'>HSK 1</button><button class='btn primary' onclick='showVocab(2)'>HSK 2</button><button class='btn primary' onclick='showVocab(3)'>HSK 3</button></div></div>`)}
function chooseStrokeLevel(){simplePage(`<div class='card center'><h2>✍️ เลือกระดับลำดับขีด</h2><div class='grid'><button class='btn primary' onclick='showStroke(1)'>HSK 1</button><button class='btn primary' onclick='showStroke(2)'>HSK 2</button><button class='btn primary' onclick='showStroke(3)'>HSK 3</button></div></div>`)}
function showVocab(l){currentLevel=l;let pool=vocab.filter(v=>v.h===l);simplePage(`<div class='card'><h2>📚 คำศัพท์ HSK ${l}</h2><p class='small'>แยกเฉพาะคำของระดับ HSK ${l}</p>${pool.map(v=>`<div style="padding:12px 0;border-bottom:1px solid #eee"><b style="font-size:25px">${v.c}</b> <span class="pill">${v.cat}</span><br><span>${v.p}</span><br><span class="small">${v.t}</span></div>`).join('')}</div>`)}
function showStroke(l){currentLevel=l;let chars=[...new Set(vocab.filter(v=>v.h===l).flatMap(v=>[...v.c].filter(ch=>/[\u3400-\u9fff]/.test(ch))))];simplePage(`<div class='card'><h2>✍️ ลำดับขีด HSK ${l}</h2><p class='small'>เลือกตัวอักษรจีนเพื่อดูภาพเคลื่อนไหวลำดับขีด</p><div id='charGrid' style='display:flex;flex-wrap:wrap;gap:8px'>${chars.map(ch=>`<button class='token' onclick="strokeDetail('${ch}',${l})">${ch}</button>`).join('')}</div></div>`)}
function strokeDetail(ch,l){simplePage(`<div class='card center'><h2>✍️ ${ch}</h2><div id='strokeTarget' style='width:260px;height:260px;margin:10px auto;border:1px solid #ead7c5;border-radius:18px'></div><p class='small'>กดเล่นเพื่อดูการเขียนทีละขีด</p><button class='btn primary' onclick='animateStroke()'>▶️ เล่นลำดับขีด</button><button class='btn' style='margin-top:10px' onclick='showStroke(${l})'>← เลือกตัวอักษรอื่น</button></div>`);loadHanziWriter(()=>{window.hw=HanziWriter.create('strokeTarget',ch,{width:260,height:260,padding:15,showOutline:true,showCharacter:false});window.hw.animateCharacter()})}
function loadHanziWriter(cb){if(window.HanziWriter){cb();return}let sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/hanzi-writer@3.7/dist/hanzi-writer.min.js';sc.onload=cb;sc.onerror=()=>{document.getElementById('strokeTarget').innerHTML='<p style="padding:40px 15px">ต้องเชื่อมต่ออินเทอร์เน็ตเพื่อโหลดข้อมูลลำดับขีด</p>'};document.head.appendChild(sc)}
function animateStroke(){if(window.hw)window.hw.animateCharacter()}

function chooseQuizLevel(){simplePage(`<div class='card center'><h2>🎮 เลือกระดับ Quiz</h2><div class='grid'><button class='btn primary' onclick='start(1)'>HSK 1</button><button class='btn primary' onclick='start(2)'>HSK 2</button><button class='btn primary' onclick='start(3)'>HSK 3</button></div></div>`)}
function chooseSentenceLevel(){simplePage(`<div class='card center'><h2>🧩 เลือกระดับเรียงประโยค</h2><div class='grid'><button class='btn primary' onclick='sentenceGame(1)'>HSK 1</button><button class='btn primary' onclick='sentenceGame(2)'>HSK 2</button><button class='btn primary' onclick='sentenceGame(3)'>HSK 3</button></div></div>`)}
function showCategories(l){currentLevel=l;hide();let el=document.getElementById('categories');el.classList.remove('hidden');let names=[...new Set(vocab.filter(v=>v.h===l).map(v=>v.cat))];el.innerHTML=`<div class='top'><button class='btn' style='width:auto' onclick='levelMenu(${l})'>← กลับ</button><h2>HSK ${l} • หมวด Quiz</h2></div><p class='small'>แสดงเฉพาะหมวดที่มีคำใน HSK ${l}</p><div class='grid'>${names.map(n=>`<button class='card center btn' onclick="startCategory(${l},'${n}')">${catIcons[n]||'📌'}<br><b>${n}</b></button>`).join('')}</div>`}
function startCategory(l,name){currentLevel=l;let pool=vocab.filter(v=>v.h===l && v.cat===name);start(l,pool)}
function start(l,customPool){currentLevel=l;let pool=customPool||vocab.filter(v=>v.h===l);let key='cq_recent_'+l,recent=[];try{recent=JSON.parse(localStorage.getItem(key)||'[]')}catch(e){};let fresh=pool.filter(v=>!recent.includes(v.c));if(fresh.length<10)fresh=pool;let chosen=shuffle(fresh).slice(0,Math.min(10,fresh.length));if(chosen.length<10 && pool.length>=10)chosen=chosen.concat(shuffle(pool.filter(v=>!chosen.includes(v))).slice(0,10-chosen.length));game=chosen.map(v=>makeQuestion(v,pool));try{localStorage.setItem(key,JSON.stringify(chosen.map(v=>v.c)))}catch(e){};idx=0;points=0;hide();document.getElementById('quiz').classList.remove('hidden');renderQ()}
function renderQ(){locked=false;let q=game[idx];document.getElementById('progress').textContent=`คำถาม ${idx+1}/${game.length} • HSK ${currentLevel}`;document.getElementById('score').textContent=points;document.getElementById('qword').textContent=q.c;document.getElementById('qpinyin').textContent=q.p;let a=document.getElementById('answers');a.innerHTML='';q.o.forEach((x,i)=>{let b=document.createElement('button');b.className='btn answer';b.textContent=String.fromCharCode(65+i)+'. '+x;b.onclick=()=>answer(b,x);a.appendChild(b)});document.getElementById('feedback').classList.add('hidden');document.getElementById('next').classList.add('hidden')}
function answer(btn,x){if(locked)return;locked=true;let q=game[idx],ok=x===q.t;if(ok){points++;btn.classList.add('correct');document.getElementById('feedback').innerHTML='✅ <b>ถูกต้อง!</b> +1 คะแนน'}else{btn.classList.add('wrong');[...document.querySelectorAll('.answer')].find(b=>b.textContent.endsWith(q.t))?.classList.add('correct');document.getElementById('feedback').innerHTML=`❌ <b>ยังไม่ถูก</b><br>คำตอบที่ถูกคือ <b>${q.t}</b><br>${q.c} (${q.p})`}document.getElementById('score').textContent=points;document.getElementById('feedback').classList.remove('hidden');document.getElementById('next').classList.remove('hidden')}
function nextQ(){idx++;if(idx<game.length)renderQ();else finish()}function finish(){hide();document.getElementById('result').classList.remove('hidden');finalScore.textContent=points;correctN.textContent=points;wrongN.textContent=game.length-points;document.getElementById('finalTotal').textContent=game.length;level.textContent=points>=9?'ยอดเยี่ยม':points>=7?'ดีมาก':points>=5?'ดี':'ลองอีกครั้ง'}
function simplePage(html){hide();let s=document.getElementById('simple');s.classList.remove('hidden');s.innerHTML=`<div class='top'><button class='btn' style='width:auto' onclick='home()'>← กลับ</button></div>${html}`}
let sentIdx=0,built=[],sentencePool=[];
function sentenceGame(l){currentLevel=l;sentencePool=shuffle(sentences.filter(x=>x.h===l));sentIdx=0;if(!sentencePool.length){simplePage(`<div class='card center'><h2>🧩 HSK ${l}</h2><p>กำลังเพิ่มชุดเรียงประโยคสำหรับระดับนี้ โดยจะไม่ดึงประโยคจากระดับอื่นมาปน</p><button class='btn' onclick='levelMenu(${l})'>← กลับ</button></div>`);return}renderSentence()}
function renderSentence(){built=[];let q=sentencePool[sentIdx];simplePage(`<div class='card center'><div class='top'><span>🧩 ข้อ ${sentIdx+1}/${sentencePool.length}</span><b>เรียงประโยค</b></div><p>แตะคำตามลำดับที่ถูกต้อง</p><div id='built' class='sentence'></div><div id='tokens' style='margin-top:14px'>${q.w.map((x,i)=>`<button class='token' onclick='addTok(this)'>${x}</button>`).join(' ')}</div><div id='sentfb' class='feedback hidden'></div><button class='btn' style='margin-top:12px' onclick='resetSent()'>↩️ เริ่มเรียงใหม่</button><button class='btn primary' style='margin-top:10px' onclick='checkSent()'>ตรวจคำตอบ</button></div>`)}
function addTok(b){if(b.disabled)return;built.push(b.textContent);b.disabled=true;document.getElementById('built').textContent=built.join(' + ')}
function resetSent(){built=[];document.getElementById('built').textContent='';document.querySelectorAll('#tokens .token').forEach(b=>b.disabled=false);document.getElementById('sentfb').classList.add('hidden')}
function checkSent(){let q=sentencePool[sentIdx],f=document.getElementById('sentfb');f.classList.remove('hidden');if(built.join('')===q.a){f.innerHTML=`✅ <b>ถูกต้อง!</b><br>${q.a}。<br>${q.p}<br>${q.t}<br><button class='btn green' style='margin-top:10px' onclick='nextSent()'>${sentIdx<sentencePool.length-1?'ประโยคถัดไป →':'🎉 เล่นอีกครั้ง'}</button>`}else{f.innerHTML=`❌ <b>ยังไม่ถูก</b><br>ลองใหม่อีกครั้งได้เลย`}}
function nextSent(){if(sentIdx<sentencePool.length-1){sentIdx++;renderSentence()}else{sentenceGame(currentLevel)}}
async function shareResult(){let text=`🎉 ฉันได้ ${points}/${game.length} คะแนน ใน Chinese Quiz HSK ${currentLevel} 🇨🇳`;if(navigator.share){try{await navigator.share({title:'Chinese Quiz',text,url:location.href})}catch(e){}}else{await navigator.clipboard.writeText(text+' '+location.href);alert('คัดลอกผลคะแนนสำหรับแชร์แล้ว!')}}
</script></body></html>
